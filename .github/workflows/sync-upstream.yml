name: Sync upstream

# Keeps this fork's master current with mpv-player/mpv while preserving local
# commits (e.g. the vf_vapoursynth fast-seek patch). Reproduces what GitHub's
# "Sync fork" button does for a diverged fork: a merge, not a fast-forward.
# (The merge-upstream REST API only fast-forwards, so it can't be used here.)
#
# Pushes with the MPV_SYNC_TOKEN secret: a fine-grained PAT on this repo only,
# with Contents and Workflows read/write. GITHUB_TOKEN can't push a merge that
# brings in upstream changes to .github/workflows (GitHub refuses it without the
# workflows permission, which a workflow token can't have), and its pushes don't
# start CI on master; the PAT's do. Without the secret it falls back to
# GITHUB_TOKEN, which works only while upstream leaves the workflows alone.
#
# A conflict fails the run with the conflicting files in the run's summary
# (issues are off on this repo); resolve it by hand as a merge commit.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history required for a real merge
          token: ${{ secrets.MPV_SYNC_TOKEN || github.token }}

      - name: Configure identity
        run: |
          git config user.name  "the-database"
          git config user.email "25811902+the-database@users.noreply.github.com"

      - name: Merge upstream
        env:
          HAS_PAT: ${{ secrets.MPV_SYNC_TOKEN != '' }}
        run: |
          git remote add upstream https://github.com/mpv-player/mpv.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi
          if ! git merge -m "Merge branch 'mpv-player:master' into master" upstream/master; then
            files="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            {
              echo "## Upstream sync conflict"
              echo
              echo "The merge of upstream/master conflicts in:"
              echo
              echo '```'
              echo "$files"
              echo '```'
              echo
              echo "Resolve it by hand as a merge commit (never a rebase or squash):"
              echo
              echo '```'
              echo "git fetch upstream && git merge upstream/master"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while read -r f; do echo "::error file=$f::upstream merge conflict"; done <<< "$files"
            exit 1
          fi
          if ! git push origin master; then
            if [ "$HAS_PAT" != true ] && ! git diff --quiet HEAD^1 HEAD -- .github/workflows; then
              echo "::error::The merge changes .github/workflows, which GITHUB_TOKEN can't push: set the MPV_SYNC_TOKEN secret (see this file's header)."
            fi
            exit 1
          fi
